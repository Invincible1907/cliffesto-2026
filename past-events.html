<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A look back at memorable Cliffesto moments from past events."
    />
    <link rel="icon" href="CDN_Images/images/favicon-square.png" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="past-events.css" />
    <title>Event Gallery | Cliffesto</title>
    <style>
      body,
      a,
      button,
      div,
      * {
        cursor: url("https://cdn.jsdelivr.net/gh/Invincible1907/cliffesto-2026@main/CDN_Images/images/web-cursor-standard.png?v=4") 2 2, auto !important;
      }
    </style>
  </head>
  <body>
    <canvas class="gallery-starfield" aria-hidden="true"></canvas>
    <header class="header"></header>

    <main>
      <section class="intro" aria-labelledby="page-title">

        <p class="intro-copy">
          A glimpse into the energy, creativity, and unforgettable moments that
          shaped Cliffesto before 2026.
        </p>
      </section>

      <section class="gallery" aria-label="Photos from past Cliffesto events">
        <figure class="gallery-card">
          <img src="CDN_Images/images/past-event-images/464146300_8273685289410251_4304030219622225104_n.jpg" alt="Cliffesto past event" loading="eager" />
        </figure>
        <figure class="gallery-card">
          <img src="CDN_Images/images/past-event-images/464190492_8273684996076947_5513465819920485578_n.jpg" alt="Cliffesto past event" loading="lazy" />
        </figure>
        <figure class="gallery-card">
          <img src="CDN_Images/images/past-event-images/464225137_8273685286076918_8220882224753493045_n.jpg" alt="Cliffesto past event" loading="lazy" />
        </figure>
        <figure class="gallery-card">
          <img src="CDN_Images/images/past-event-images/464573756_8299939033451543_2266626153693651695_n.jpg" alt="Cliffesto past event" loading="lazy" />
        </figure>
        <figure class="gallery-card">
          <img src="CDN_Images/images/past-event-images/464575385_8299939276784852_6730105704286563196_n.jpg" alt="Cliffesto past event" loading="lazy" />
        </figure>
        <figure class="gallery-card">
          <img src="CDN_Images/images/past-event-images/464583738_8299965576782222_8097543383137147945_n.jpg" alt="Cliffesto past event" loading="lazy" />
        </figure>
        <figure class="gallery-card">
          <img src="CDN_Images/images/past-event-images/464586354_8299939263451520_3700678406713557199_n.jpg" alt="Cliffesto past event" loading="lazy" />
        </figure>
        <figure class="gallery-card">
          <img src="CDN_Images/images/past-event-images/464595707_8300152690096844_6009126710864341386_n.jpg" alt="Cliffesto past event" loading="lazy" />
        </figure>
        <figure class="gallery-card">
          <img src="CDN_Images/images/past-event-images/464602093_8299963470115766_2355061788901119486_n.jpg" alt="Cliffesto past event" loading="lazy" />
        </figure>
      </section>
    </main>

    <footer>CLIFFESTO 2026 <span aria-hidden="true">/</span> MEMORIES IN MOTION</footer>

    <script src="https://cdn.jsdelivr.net/npm/baffle@0.3.6/dist/baffle.min.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/starfield.js"></script>
  </body>
</html>
